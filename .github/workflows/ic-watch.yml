name: IC Watch Scheduled Run

on:
  schedule:
    # Production policy: exactly one automatic run per day at 09:00 Vietnam
    # time. There are intentionally no push or workflow_dispatch triggers, so
    # repository changes and manual dispatches cannot announce outside this
    # daily window.
    - cron: "0 9 * * *"
      timezone: "Asia/Ho_Chi_Minh"

concurrency:
  group: ic-watch-scheduled
  # Never allow two production announcers to race the persistent state.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect-and-announce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      MAX_NEWS_TO_SEND: "0"
      MAX_JOBS_TO_SEND: "0"

    steps:
      - name: Check out bot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Telegram secrets
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHANNEL_ID" ]; then
            echo "::error::Add TELEGRAM_BOT_TOKEN and TELEGRAM_CHANNEL_ID as repository Actions secrets."
            exit 1
          fi

      - name: Restore persistent dedupe state and daily run lock
        id: state
        shell: bash
        run: |
          mkdir -p data
          git fetch origin bot-state:refs/remotes/origin/bot-state

          LOCAL_DATE="$(TZ=Asia/Ho_Chi_Minh date +%F)"
          echo "local_date=$LOCAL_DATE" >> "$GITHUB_OUTPUT"

          if git show origin/bot-state:state/ic_watch.db > data/ic_watch.db 2>/dev/null && [ -s data/ic_watch.db ]; then
            echo "baseline=false" >> "$GITHUB_OUTPUT"
            echo "Restored persistent IC Watch state."
          else
            rm -f data/ic_watch.db
            echo "baseline=true" >> "$GITHUB_OUTPUT"
            echo "No persistent database yet. This run will baseline current items without sending them."
          fi

          LAST_RUN="$(git show origin/bot-state:state/last_production_date.txt 2>/dev/null | tr -d '\r\n' || true)"
          if [ "$LAST_RUN" = "$LOCAL_DATE" ]; then
            echo "already_ran=true" >> "$GITHUB_OUTPUT"
            echo "IC Watch production already ran for $LOCAL_DATE; Telegram announcement is disabled for this duplicate run."
          else
            echo "already_ran=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run regression tests
        run: python -m unittest discover -s tests

      - name: Collect and announce
        if: steps.state.outputs.already_ran != 'true'
        env:
          IC_WATCH_BASELINE_ONLY: ${{ steps.state.outputs.baseline }}
        run: python main.py

      - name: Mark today's production run
        if: success() && steps.state.outputs.already_ran != 'true'
        shell: bash
        run: |
          echo "${{ steps.state.outputs.local_date }}" > data/last_production_date.txt

      - name: Persist dedupe state and daily run lock
        if: ${{ always() && steps.state.outputs.already_ran != 'true' && hashFiles('data/ic_watch.db') != '' }}
        shell: bash
        run: |
          cp data/ic_watch.db /tmp/ic_watch.db
          if [ -f data/last_production_date.txt ]; then
            cp data/last_production_date.txt /tmp/last_production_date.txt
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin bot-state:refs/remotes/origin/bot-state
          git switch -C bot-state-sync origin/bot-state
          mkdir -p state
          cp /tmp/ic_watch.db state/ic_watch.db
          if [ -f /tmp/last_production_date.txt ]; then
            cp /tmp/last_production_date.txt state/last_production_date.txt
          fi
          git add state/ic_watch.db state/last_production_date.txt 2>/dev/null || git add state/ic_watch.db

          if git diff --cached --quiet; then
            echo "Persistent state did not change."
          else
            git commit -m "Update IC Watch state [skip ci]"
            git push origin HEAD:bot-state
          fi